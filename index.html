<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trials of Mastery · Saber 11 English</title>
<style>
:root{--bg:#14101f;--c:#241a3a;--g:#f5c542;--t:#f1ecff;--ok:#4ade80;--no:#f87171;--y:#facc15}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 'Courier New',monospace;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:16px}
h1{color:var(--g);text-align:center;font-size:21px;margin:10px 0;text-shadow:2px 2px 0 #000}
.card{background:var(--c);border:3px solid #4b3a78;padding:14px;margin:12px 0;box-shadow:4px 4px 0 #000}
.row{display:flex;justify-content:space-between;gap:8px}
.btn{display:block;width:100%;padding:12px;margin:10px 0;background:var(--g);color:#1a1200;border:3px solid #000;box-shadow:3px 3px 0 #000;font:bold 16px 'Courier New',monospace;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:focus-visible,input:focus-visible{outline:3px solid #fff}
.opt{background:var(--c);color:var(--t);border-color:#4b3a78;text-align:left;font-weight:normal}
.opt.good{background:var(--ok);color:#000}.opt.bad{background:var(--no);color:#000}
.big{font-size:28px;text-align:center;color:var(--g);margin:14px 0;word-break:break-word}
input{width:100%;padding:12px;font:18px 'Courier New',monospace;background:#0d0a16;color:var(--t);border:3px solid #4b3a78}
mark{background:rgba(245,197,66,.28);color:var(--g);padding:0 2px}
.g{color:var(--ok)}.y{color:var(--y)}.r{color:var(--no)}.small{font-size:13px;opacity:.8}
a{color:var(--g)}
</style></head><body><div id="app"></div>
<script>
// ---------- DATOS (agrega unidades/palabras aquí) ----------
// w: "inglés|traducción;alternativa,..."   q: [tipo T=textual / I=inferencial, pregunta, opciones, índice correcto]
const U=[
{n:'Education',w:'exam|examen,subject|materia;asignatura,homework|tarea,grade|nota;calificación,lesson|lección;clase,fail|reprobar;perder,pass|aprobar,learn|aprender',
t:'Sofia has an important exam on Monday. She studies every afternoon after her lessons. Her favorite subject is science, but math is difficult for her. Last week she failed a math exam, so now she does extra homework. She wants to learn from her mistakes, pass the exam and get a good grade.',
q:[['T','When does Sofia have an exam?',['On Monday','On Sunday','Last week'],0],['I','Why does Sofia do extra homework?',['She loves math','She did badly on a math exam','Her teacher is angry'],1]]},
{n:'Travel',w:'ticket|boleto;tiquete,luggage|equipaje,passport|pasaporte,flight|vuelo,trip|viaje,abroad|en el extranjero;al extranjero,book|reservar,delay|retraso',
t:'Carlos is planning a trip abroad. He booked a flight to Madrid and bought his ticket online. Yesterday he packed his luggage and checked his passport. Today the airline sent a message: there is a two-hour delay. Carlos is not happy, but he waits calmly at the airport.',
q:[['T','What did the airline send?',['A ticket','A message about a delay','A passport'],1],['I','How does Carlos feel at the end?',['He is angry and leaves','He is upset but patient','He is very excited'],1]]},
{n:'Work',w:'boss|jefe,salary|salario;sueldo,interview|entrevista,hire|contratar,apply|aplicar;postularse,schedule|horario,experience|experiencia,employee|empleado',
t:'Laura wants a new job. She applied to a company last week and today she has an interview. The boss asks about her experience and her schedule. She says she can work in the mornings. At the end, the boss says the salary is good and they want to hire her as a new employee.',
q:[['T','When can Laura work?',['In the mornings','At night','On weekends'],0],['I','What will probably happen next?',['Laura gets the job','Laura loses her interview','The company closes'],0]]},
{n:'Free time',w:'hobby|pasatiempo,movie|película,bored|aburrido,join|unirse,draw|dibujar,enjoy|disfrutar,hang out|salir con amigos;pasar el rato',
t:'Mateo was bored last weekend, so he decided to join a drawing club. His hobby is to draw, but he never has time. At the club he met new people and they hang out after class. Now they watch a movie together every Friday, and Mateo enjoys it a lot.',
q:[['T','Why did Mateo join the club?',['He was bored','He is a teacher','He lost his hobby'],0],['I','What can we infer about Mateo?',['He now has more friends','He dislikes movies','He is very busy'],0]]},
{n:'Health',w:'sick|enfermo,headache|dolor de cabeza,fever|fiebre,doctor|doctor;médico,medicine|medicina;medicamento,advice|consejo,rest|descansar;descanso,healthy|saludable;sano',
t:'Ana feels sick today. She has a headache and a fever. The doctor gives her some medicine and an important piece of advice: rest for three days and drink a lot of water. Ana wants to be healthy again, so she follows everything the doctor says.',
q:[['T','What does the doctor recommend?',['Run every day','Rest and drink water','Go to school'],1],['I','Why does Ana follow the advice?',['She wants to get better','She is afraid of water','She likes medicine'],0]]},
{n:'Vacations',w:'beach|playa,hotel|hotel,sunscreen|protector solar;bloqueador solar,tourist|turista,souvenir|recuerdo,crowded|lleno de gente;abarrotado,relax|relajarse,sea|mar',
t:'Last summer my family went to a beach for two weeks. The hotel was near the sea, but the beach was crowded with tourists. Every morning we used sunscreen and played in the water. In the afternoons I relaxed and bought souvenirs for my friends. It was not the quietest place, but we loved it.',
q:[['T','Where was the hotel?',['Near the sea','In the mountains','Far from the beach'],0],['I','What can we infer about the beach?',['It was empty','It was popular','It was dangerous'],1]]},
{n:'Transport',w:'subway|metro,traffic|tráfico;trafico,bus stop|parada de bus;paradero,late|tarde,walk|caminar,bike|bicicleta,fare|tarifa;pasaje,ride|montar;viajar en',
t:'Every day Pedro rides the subway to work because the traffic in his city is terrible. Last Monday he was late because there was a problem at the bus stop and he had to walk. Now he thinks about buying a bike. It is cheaper than the fare and he does not wait for anyone.',
q:[['T','Why was Pedro late on Monday?',['There was a problem at the bus stop','He lost his bike','He drove too slowly'],0],['I','Why does Pedro want a bike?',['It is cheaper and he does not have to wait','He dislikes the people on the subway','He wants to drive'],0]]},
{n:'Environment',w:'recycle|reciclar,plastic|plástico;plastico,waste|desperdicio;basura,energy|energía;energia,pollution|contaminación;contaminacion,planet|planeta,climate|clima,save|ahorrar;salvar',
t:'Our class started a project to save the planet. First, we recycle plastic and paper at school. Then we try to reduce waste and save energy by turning off the lights. Pollution is a big problem, and climate change makes it worse. Small actions can help everyone.',
q:[['T','How does the class save energy?',['By turning off the lights','By riding bikes','By planting trees'],0],['I','What is the main idea?',['Small actions help the environment','Only governments can help','Plastic is useful'],0]]},
{n:'Sports',w:'team|equipo,match|partido,coach|entrenador,practice|practicar;entrenar,win|ganar,champion|campeón;campeon,score|anotar;marcar',
t:'Our school team has a big match on Saturday. The coach says we must practice every day. Last season we lost the final, but this year we want to win and be champions. Diego is the best player and he can score many goals. If everyone works together, we will do it.',
q:[['T','When is the match?',['On Saturday','On Friday','Next season'],0],['I','What can we infer about last season?',['The team did not win the final','The team won every match','Diego was the coach'],0]]}
];
// Vocabulario base tomado de TOM (u:-1 = repaso permanente)
const T='always|siempre,therefore|por lo tanto,sustainable|sostenible,landslide|derrumbe,however|sin embargo,although|aunque,because of|por causa de,biodiversity|biodiversidad,environment|ambiente;medio ambiente,alternative|alternativa,send|enviar,describe|describir,repeat|repetir,shout|gritar,need|necesitar,try|intentar,disappear|desaparecer,destroy|destruir,protect|proteger,without|sin,usually|normalmente;usualmente,quickly|rápidamente,finally|finalmente,never|nunca,rarely|raramente,give up|rendirse,sometimes|a veces,actually|de hecho;en realidad,should|debería,support|apoyar,must|tener que,government|gobierno,safe|seguro,blame|culpar,complicated|complicado,explain|explicar,believe|creer,future|futuro';

// ---------- BANCO SABER 11 (agrega ejercicios aquí) ----------
// Formato de cada pregunta: [enunciado, respuesta correcta, incorrecta, incorrecta, (incorrecta), explicación]
const P=['Parte 1: palabras','Parte 2: avisos','Parte 3: conversaciones','Parte 4: gramática (cloze)','Parte 5: lectura (3 opciones)','Parte 6: lectura (4 opciones)','Parte 7: vocabulario (cloze)'];
const B=[
{p:0,s:'<b>Word bank:</b> apple · basket · bread · juice · map · shirt · shop',q:[
['You carry fruit in this.','basket','shirt','map','juice','basket = canasta.'],
['You drink this at breakfast. It is made from oranges.','juice','bread','apple','shop','juice = jugo.'],
['You use this to find the way in a new city.','map','shirt','basket','bread','map = mapa.'],
['You buy clothes and food in this place.','shop','apple','juice','map','shop = tienda.'],
['You eat this with butter. It is made from flour.','bread','shirt','shop','basket','bread = pan.']]},
{p:1,s:'¿Dónde puede ver estos avisos?',q:[
['"Silence, please. Reading area."','in a library','at a stadium','in a gym','Silencio para leer: biblioteca.'],
['"Rock concert tonight, 8 p.m. 2 tickets for the price of 1."','at a concert hall','at a hospital','at a bank','Concierto + tickets: sala de conciertos.'],
['"Do not feed the animals."','at a zoo','in a bakery','on a plane','Animales que no se alimentan: zoológico.'],
['"Fasten your seat belt."','on a plane','in a classroom','at a beach','Cinturón de seguridad: avión.'],
['"Ice cream: 2 scoops for the price of 1."','in an ice cream shop','in a bank','in a library','Ice cream = helado: heladería.']]},
{p:2,s:'Complete las conversaciones.',q:[
['I lost my phone!','Oh no! Where did you leave it?','It is very expensive.','I like your phone.','Ante un problema, se responde con empatía o una pregunta lógica.'],
['Would you like some water?','Yes, please.','At six o\'clock.','It is mine.','Would you like = ofrecimiento. Se acepta con "Yes, please".'],
['How was your weekend?','It was great. We went to the beach.','I am in the park.','Yes, he is.','How was = pregunta en pasado, se responde en pasado.'],
['Can you help me with my homework?','Sure. What is the problem?','No, it is Tuesday.','I have a new bike.','Can you help me = petición de ayuda.'],
['I have a headache.','You should rest.','Congratulations!','It is a nice hat.','should = consejo.']]},
{p:3,s:'My sister Clara <b>(1)</b> a nurse. She works <b>(2)</b> a hospital <b>(3)</b> the city center. Yesterday she <b>(4)</b> very tired <b>(5)</b> she worked twelve hours. She <b>(6)</b> go to bed early today.',q:[
['(1)','is','are','am','Con she/he/it se usa is.'],
['(2)','in','between','after','works in a hospital = trabaja en un hospital.'],
['(3)','near','than','because','near = cerca de (preposición de lugar).'],
['(4)','was','were','is','Yesterday pide pasado; con she se usa was.'],
['(5)','because','but','or','because = porque (causa).'],
['(6)','should','is','going','should + verbo base = consejo.']]},
{p:4,s:'<b>Tom\'s Bike Shop</b> opens at 9 a.m. from Monday to Saturday. On Sundays it is closed. Customers can buy new bikes or repair old ones. If you buy a bike this month, you get a free helmet.',q:[
['When is the shop closed?','On Sundays','On Saturdays','In the morning','Pregunta textual: "On Sundays it is closed".'],
['What do customers get with a new bike this month?','A free helmet','A repair','A discount card','Pregunta textual: "free helmet".'],
['This text is mainly written for people who','want to buy or fix a bike','sell helmets','work in a school','Pregunta de propósito: es un aviso para clientes.']]},
{p:5,s:'I moved to a new city last year. At first I felt alone because I did not know anyone. Then I joined a football team at my university. Now I play every Saturday and I have many friends. I think moving was difficult, but it was the best decision for me.',q:[
['What is the writer trying to do?','Share a personal experience','Sell a product','Explain football rules','Ask for help','Cuenta su propia historia (first person).'],
['Why did the writer feel alone at first?','He did not know anyone','He hated football','He had no money','His team lost','Pregunta textual: "because I did not know anyone".'],
['What can we infer about the writer now?','He is happy with his decision','He wants to leave the city','He stopped playing football','He has no friends','Inferencia: "the best decision for me".']]},
{p:6,s:'Every summer my family <b>(1)</b> a trip to the mountains. We <b>(2)</b> our bags the night before and leave early. The road is <b>(3)</b>, so we need to drive slowly. When we <b>(4)</b>, we eat lunch next to a river. It is a <b>(5)</b> place to relax.',q:[
['(1)','takes','catches','puts','wins','take a trip = hacer un viaje.'],
['(2)','pack','break','cook','paint','pack bags = empacar maletas.'],
['(3)','narrow','hungry','polite','cheap','narrow road = camino estrecho; por eso se maneja despacio.'],
['(4)','arrive','borrow','forget','wear','arrive = llegar.'],
['(5)','peaceful','dangerously','quickly','heavy','peaceful = tranquilo; va antes de "place".']]}
];

// ---------- ESTADO ----------
const $=s=>document.querySelector(s),A=$('#app'),td=()=>new Date().toLocaleDateString('en-CA'),dd=n=>new Date(Date.now()+n*864e5).toLocaleDateString('en-CA');
let S={start:td(),xp:0,coins:0,streak:0,last:'',sess:0,rs:0,m:{},p:{}};
try{S={...S,...JSON.parse(localStorage.getItem('tom3'))}}catch(e){}
const save=()=>{try{localStorage.setItem('tom3',JSON.stringify(S))}catch(e){}};
const mk=(s,u)=>s.split(',').map(x=>{const[a,b]=x.split('|');return{en:a.trim(),es:b.split(';'),u}});
const W=[...U.flatMap((x,i)=>mk(x.w,i)),...mk(T,-1)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
// Repetición espaciada (cajas 0-6): cada acierto sube de caja y alarga el intervalo; un error vuelve a la caja 0
const IV=[0,1,2,4,7,14,30];
const rank=w=>{const m=S.m[w.en];return !m?1:m.b==0?0:m.due<=td()?.5:3}; // primero errores, luego nuevas, luego vencidas; las no vencidas al final
const pick=(a,n)=>a.map(w=>[rank(w)+Math.random()*.4,w]).sort((p,q)=>p[0]-q[0]).slice(0,n).map(x=>x[1]);
function mark(w,ok){const b=ok?Math.min(((S.m[w.en]||{}).b||0)+1,6):0;S.m[w.en]={b,due:dd(IV[b])}}

// ---------- PANTALLAS ----------
function home(){
 const c=[0,0,0];W.forEach(w=>{const m=S.m[w.en];if(m)c[m.b==0?0:m.b<4?1:2]++});
 const day=Math.floor((new Date(td())-new Date(S.start))/864e5)+1,L=d=>Math.max(0,Math.ceil((new Date(d)-new Date(td()))/864e5));
 const u=U[S.sess%U.length],done=S.last==td();
 A.innerHTML=`<h1>⚔ TRIALS OF MASTERY ⚔</h1><p style="text-align:center">Saber 11 · English A2–B1</p>
 <div class="card row"><span>🔥 ${S.streak}</span><span>⭐ ${S.xp} XP</span><span>🪙 ${S.coins}</span></div>
 <div class="card"><b>Día ${day}</b>: ${L('2027-04-30')} días para abril (vocabulario) y ${L('2027-06-30')} para junio (práctica Saber 11).<br>${done?'✅ Meta de hoy cumplida (puedes seguir)':'🎯 Meta de hoy: 1 sesión (≈20 min)'}<br>Tema: <b>${u.n}</b> + repaso · Hoy: <b>${P[S.sess%7]}</b>
 <p><span class="g">● ${c[2]} dominadas</span><br><span class="y">● ${c[1]} en práctica</span><br><span class="r">● ${c[0]} por reforzar</span><br>de ${W.length} palabras</p></div>
 <button class="btn" id="go">ENTER TRIAL (sesión diaria)</button><button class="btn opt" id="sb">PRÁCTICA SABER 11 (7 partes)</button>
 <p class="small" style="text-align:center"><a href="#" id="rs">Borrar progreso</a></p>`;
 $('#go').onclick=()=>trial();$('#sb').onclick=menuS;
 $('#rs').onclick=e=>{e.preventDefault();if(confirm('¿Borrar todo el progreso?')){try{localStorage.removeItem('tom3')}catch(x){}location.reload()}}}

function menuS(){
 A.innerHTML=`<h1>PRUEBA SABER 11</h1>${P.map((p,i)=>`<button class="btn opt" data-i="${i}">${p} · ${S.p[i]||0} hechos</button>`).join('')}<button class="btn" id="h">VOLVER</button>`;
 A.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>saber(+b.dataset.i));$('#h').onclick=home}

// Trial: reconocimiento inglés → español (como evalúa el ICFES: identificar, no producir)
function trial(L,focus){
 if(!L)L=shuf([...pick(W.filter(w=>w.u==S.sess%U.length),6),...pick(W.filter(w=>w.u<0),4)]);
 let i=0,en=5,t=90,st=0,sc=0,bad=[],busy=0,fin=0,iv;
 const end=()=>{if(fin)return;fin=1;clearInterval(iv);res(sc,bad,focus,L.length)};
 const show=()=>{if(fin)return;if(i>=L.length||en<=0||t<=0)return end();
  const w=L[i],a=w.es[0],o=shuf([a,...[...new Set(shuf(W).map(x=>x.es[0]).filter(x=>x!=a))].slice(0,3)]);
  A.innerHTML=`<div class="card row"><span>${focus?'🎯 FOCUS':'⏱ <b id="t">'+t+'</b>s'}</span><span>${'❤'.repeat(en)}</span><span>🔥 ${st}</span></div>
  <div class="card"><p class="small">${i+1}/${L.length} · ¿Qué significa?</p><div class="big">${w.en}</div>${o.map(x=>`<button class="btn opt">${x}</button>`).join('')}<p id="f"></p></div>`;
  const bs=[...A.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{if(busy)return;busy=1;const ok=b.textContent==a,ms=[3,5,7,10].includes(st+1),f=$('#f');
   mark(w,ok);bs.find(x=>x.textContent==a).classList.add('good');
   if(ok){st++;sc++;S.xp+=10+(st>=3?5:0);S.coins+=ms?5:1;f.innerHTML='<span class="g">✔ Correct!'+(ms?' 🔥 Racha x'+st:'')+'</span>'}
   else{st=0;if(!focus)en--;bad.push(w);b.classList.add('bad');f.innerHTML='<span class="r">✘ '+w.en+' = '+w.es.join(' / ')+'</span>'}
   i++;setTimeout(()=>{busy=0;show()},ok?700:1700)})};
 if(!focus)iv=setInterval(()=>{t--;const e=$('#t');if(e)e.textContent=Math.max(t,0);if(t<=0&&!busy)end()},1000);
 show()}

function res(sc,bad,focus,n){save();
 A.innerHTML=`<h1>${focus?'FOCUS COMPLETO':'TRIAL COMPLETO'}</h1><div class="card"><div class="big">${sc}/${n}</div>
 ${bad.length?'<p>Palabras por reforzar:</p>'+bad.map(w=>`<p><span class="r">●</span> ${w.en} = ${w.es[0]}</p>`).join(''):'<p class="g">¡Sin errores!</p>'}</div>
 ${bad.length&&!focus?'<button class="btn" id="fx">FOCUS TRAINING</button>':''}<button class="btn" id="nx">SIGUIENTE: LECTURA</button>`;
 if(bad.length&&!focus)$('#fx').onclick=()=>trial(shuf(bad.slice()),1);
 $('#nx').onclick=read}

// Motor de preguntas: cada pregunta = [enunciado, opciones, índice correcto, explicación, etiqueta]
function quiz(set,done){let i=0,sc=0;
 const q=()=>{if(i>=set.q.length)return done(sc,set.q.length);
  const[s,o,c,w,tag]=set.q[i],ord=shuf(o.map((_,j)=>j));
  A.innerHTML=`<h1>${set.h}</h1>${set.s?`<div class="card">${set.s}</div>`:''}<div class="card"><p class="small">${tag||''} · ${i+1}/${set.q.length}</p><b>${s}</b>${ord.map((j,p)=>`<button class="btn opt" data-j="${j}">${'ABCD'[p]}. ${o[j]}</button>`).join('')}<p id="w" class="small"></p></div>`;
  const bs=[...A.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.onclick=null);
   bs.find(x=>+x.dataset.j==c).classList.add('good');
   if(+b.dataset.j==c){sc++;S.xp+=15}else b.classList.add('bad');
   $('#w').textContent=w||'';
   const n=document.createElement('button');n.className='btn';n.textContent='SIGUIENTE';n.onclick=()=>{i++;q()};$('#w').after(n)})};
 q()}

function read(){
 const u=U[S.sess%U.length],re=new RegExp('\\b('+u.w.split(',').map(x=>x.split('|')[0].trim()).join('|')+')\\w*','gi'),tx=u.t.replace(re,m=>'<mark>'+m+'</mark>');
 quiz({h:u.n,s:tx,q:u.q.map(x=>[x[1],x[2],x[3],'',x[0]=='T'?'Pregunta textual':'Pregunta inferencial'])},sc=>{S.rs=sc;saber(S.sess%7,fin)})}

function saber(i,next){
 const L=B.filter(x=>x.p==i),set=L[(S.p[i]||0)%L.length];
 quiz({h:P[i],s:set.s,q:set.q.map(a=>[a[0],a.slice(1,-1),0,a[a.length-1],P[i]])},(sc,n)=>{S.p[i]=(S.p[i]||0)+1;save();
  if(next)return next();
  A.innerHTML=`<h1>${sc}/${n}</h1><button class="btn" id="a">OTRO EJERCICIO</button><button class="btn opt" id="m">MENÚ</button>`;$('#a').onclick=()=>saber(i);$('#m').onclick=menuS})}

function fin(){
 const y=dd(-1);
 if(S.last!=td()){S.streak=S.last==y?S.streak+1:1;S.last=td()}
 S.sess++;save();
 A.innerHTML=`<h1>¡SESIÓN COMPLETA!</h1><div class="card"><p>🔥 Racha diaria: ${S.streak}<br>⭐ XP total: ${S.xp}</p><p>Mañana: palabras que toca repasar según tu historial, tema nuevo y otra parte de la prueba.</p></div><button class="btn" id="h">VOLVER AL INICIO</button>`;
 $('#h').onclick=home}
home();
</script></body></html>
